# ---------------------------------------------------------------------------
# 단일 노드(VirtualBox 등) 클러스터용 hostPath PV.
# 동적 프로비저너(StorageClass)가 이미 있다면 이 파일을 kustomization 에서 빼고
# PVC 의 storageClassName: manual / volumeName 줄도 제거해 기본 StorageClass 를 쓴다.
#
# 적용 전 노드에서 디렉터리를 미리 만든다:
#   mkdir -p /data/gitlab/config /data/gitlab/data
#
# GitLab omnibus 컨테이너는 root 로 동작하고 내부 프로세스 UID(git=998 등)를
# 스스로 맞춘다. jenkins/nexus 와 달리 chown 이 필요 없다.
#
# 용량 주의: /var/opt/gitlab 아래에 git 리포지토리 + PostgreSQL + Redis +
# 아티팩트가 모두 들어간다. 100Gi 는 넉넉한 편이 아니다.
# ---------------------------------------------------------------------------
apiVersion: v1
kind: PersistentVolume
metadata:
  name: gitlab-config-pv
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual
  hostPath:
    path: /data/gitlab/config
    type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: gitlab-data-pv
spec:
  capacity:
    storage: 100Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual
  hostPath:
    path: /data/gitlab/data
    type: DirectoryOrCreate
