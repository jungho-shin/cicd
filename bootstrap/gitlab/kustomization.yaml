apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: gitlab

resources:
  - namespace.yaml
  - local-pv.yaml       # 동적 프로비저너가 있으면 이 줄 삭제
  - gitlab.yaml
  - ingress.yaml
  # DNS/Ingress 없이 노드 IP 로 접속하려면 주석 해제 (http://<노드IP>:30080)
  # - nodeport.yaml
  # GitLab 이 뜬 뒤 러너 토큰을 발급받아 runner.yaml 에 채우고 주석 해제한다
  # - runner.yaml
