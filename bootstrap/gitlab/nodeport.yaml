# Ingress 나 DNS 가 아직 없을 때 노드 IP 로 바로 접속하기 위한 NodePort.
# 사용하려면 kustomization.yaml 의 resources 에서 주석을 해제한다.
#
#   UI/HTTP   http://<노드IP>:30080
#   git+ssh   ssh://git@<노드IP>:30022
#
# NodePort 로 접속한다면 gitlab.yaml 의 external_url 도
# 'http://<노드IP>:30080' 으로 바꿔야 clone 주소와 리디렉션이 맞는다.
apiVersion: v1
kind: Service
metadata:
  name: gitlab-nodeport
  namespace: gitlab
spec:
  type: NodePort
  selector:
    app: gitlab
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30080
    - name: ssh
      port: 22
      targetPort: 22
      nodePort: 30022
