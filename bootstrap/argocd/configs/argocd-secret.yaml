# NOTE: patch 대상 매칭용 파일이므로 metadata.namespace 를 지정하지 않는다.
# upstream install.yaml 의 리소스에는 namespace 가 없고, kustomization 의
# `namespace: argocd` 트랜스포머는 patch 적용 이후에 실행되기 때문이다.
# Bitbucket webhook 검증용 시크릿을 argocd-secret 에 병합한다.
# Bitbucket Cloud 는 webhook secret 헤더를 지원하지 않으므로 Server(DC) 전용이며,
# Cloud 인 경우 이 항목 없이 /api/webhook 엔드포인트만 사용한다.
apiVersion: v1
kind: Secret
metadata:
  name: argocd-secret
type: Opaque
stringData:
  webhook.bitbucketserver.secret: __REPLACE_ME__
