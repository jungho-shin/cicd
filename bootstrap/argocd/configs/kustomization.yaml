apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# install.yaml 에 없는 신규 리소스만 resources 로 추가한다.
#
# repo-gitlab.yaml 은 기본 제외한다. 토큰은 README 4.2 A 처럼 kubectl create secret
# 으로 넣는다. placeholder 인 채로 적용하면 같은 이름의 시크릿이 먼저 생겨
# create 가 AlreadyExists 로 실패하고, 이후 apply 할 때마다 실제 값을 덮어쓴다.
resources: []
  # - repo-gitlab.yaml

# install.yaml 에 이미 존재하는 ConfigMap/Secret 은 patch 로 병합한다.
# (resources 로 넣으면 "already registered id" 오류가 난다)
#
# argocd-secret.yaml / notifications-secret.yaml 은 기본 제외한다. 값이 __REPLACE_ME__ 라
# 적용하면 README 5 / 4.2 의 kubectl patch 로 넣은 실제 값을 되돌리고, 실제 값을 파일에
# 적으면 커밋된다. 파일은 키 이름 예시로 보관한다.
patches:
  - path: argocd-cm.yaml
  - path: argocd-rbac-cm.yaml
  - path: argocd-cmd-params-cm.yaml
  - path: notifications-cm.yaml
  # - path: argocd-secret.yaml
  # - path: notifications-secret.yaml
