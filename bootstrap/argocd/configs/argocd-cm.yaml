# NOTE: patch 대상 매칭용 파일이므로 metadata.namespace 를 지정하지 않는다.
# upstream install.yaml 의 리소스에는 namespace 가 없고, kustomization 의
# `namespace: argocd` 트랜스포머는 patch 적용 이후에 실행되기 때문이다.
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
  labels:
    app.kubernetes.io/name: argocd-cm
    app.kubernetes.io/part-of: argocd
data:
  # 외부 접속 URL (Ingress host 와 일치해야 SSO/링크가 정상 동작)
  url: https://argocd.example.com

  # GitLab SSO 를 쓰지 않는 경우, 로컬 계정으로 CI 전용 사용자 생성
  accounts.cicd: apiKey, login

  # Application 이 배포될 수 있는 네임스페이스 (app-in-any-namespace)
  application.namespaces: argocd, cicd

  # kustomize 빌드 옵션
  kustomize.buildOptions: --enable-helm

  # 리소스 diff 제외 (HPA 가 관리하는 replicas 등)
  resource.customizations.ignoreDifferences.apps_Deployment: |
    jsonPointers:
      - /spec/replicas

  # ---------------------------------------------------------------
  # GitLab SSO (선택). GitLab 은 OIDC/OAuth2 IdP 를 자체 제공하므로 Dex 의
  # gitlab 커넥터를 그대로 쓴다. GitLab 의 Admin Area > Applications 에서
  # redirect URI 를 https://argocd.example.com/api/dex/callback 로 등록하고
  # scope 는 read_user, openid 를 준다. 사용 시 주석 해제.
  # ---------------------------------------------------------------
  # dex.config: |
  #   connectors:
  #     - type: gitlab
  #       id: gitlab
  #       name: GitLab
  #       config:
  #         baseURL: https://gitlab.example.com
  #         clientID: $dex.gitlab.clientId
  #         clientSecret: $dex.gitlab.clientSecret
  #         groups:
  #           - my-group
