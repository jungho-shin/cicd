# ---------------------------------------------------------------------------
# Bitbucket 리포지토리 자격증명
# 실제 값은 절대 git 에 커밋하지 말 것. SealedSecrets / External Secrets /
# `kubectl create secret` 중 하나로 주입한다. (README 참고)
# ---------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: repo-bitbucket-https
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repository
type: Opaque
stringData:
  type: git
  name: bitbucket-gitops
  url: https://bitbucket.org/my-workspace/gitops-manifests.git
  # Bitbucket Cloud: username = 워크스페이스 사용자명, password = App Password(Repositories:Read)
  # Bitbucket Data Center: password = HTTP access token
  username: __REPLACE_ME__
  password: __REPLACE_ME__
---
# 같은 워크스페이스의 모든 리포지토리에 공통 자격증명을 적용하려면 credential template 사용
apiVersion: v1
kind: Secret
metadata:
  name: repo-creds-bitbucket-workspace
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repo-creds
type: Opaque
stringData:
  type: git
  url: https://bitbucket.org/my-workspace
  username: __REPLACE_ME__
  password: __REPLACE_ME__
---
# SSH 방식을 쓰는 경우 (위 HTTPS 대신 선택)
