# NOTE: patch 대상 매칭용 파일이므로 metadata.namespace 를 지정하지 않는다.
# upstream install.yaml 의 리소스에는 namespace 가 없고, kustomization 의
# `namespace: argocd` 트랜스포머는 patch 적용 이후에 실행되기 때문이다.
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-rbac-cm
  labels:
    app.kubernetes.io/name: argocd-rbac-cm
    app.kubernetes.io/part-of: argocd
data:
  policy.default: role:readonly
  scopes: '[groups, email]'
  policy.csv: |
    # 플랫폼 관리자
    p, role:platform-admin, applications, *, */*, allow
    p, role:platform-admin, repositories, *, *, allow
    p, role:platform-admin, projects, *, *, allow
    p, role:platform-admin, clusters, *, *, allow

    # 개발팀: dev 프로젝트만 동기화 가능
    p, role:dev, applications, get, dev/*, allow
    p, role:dev, applications, sync, dev/*, allow
    p, role:dev, applications, action/*, dev/*, allow
    p, role:dev, logs, get, dev/*, allow

    # CI(GitLab CI) 전용 계정: 동기화 트리거만 허용
    p, role:ci, applications, get, */*, allow
    p, role:ci, applications, sync, */*, allow

    g, cicd, role:ci
    g, my-group:platform, role:platform-admin
    g, my-group:developers, role:dev
