apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: argocd

# Argo CD 공식 설치 매니페스트를 base 로 사용한다.
# 버전은 클러스터 k8s 버전과 호환되는 태그로 고정할 것.
#   install.yaml     : 단일 인스턴스(개발/소규모)
#   ha/install.yaml  : 운영(HA, Redis 3-node)
resources:
  - namespace.yaml
  - https://raw.githubusercontent.com/argoproj/argo-cd/v3.0.6/manifests/install.yaml
  # 운영에서는 위 줄 대신 아래 사용
  # - https://raw.githubusercontent.com/argoproj/argo-cd/v3.0.6/manifests/ha/install.yaml
  - ingress.yaml

# configs/ 컴포넌트가 argocd-cm, argocd-rbac-cm, argocd-cmd-params-cm,
# argocd-secret, notifications 설정을 병합한다.
# argocd-server 의 --insecure 는 argocd-cmd-params-cm 의 server.insecure 로 제어된다.
components:
  - ./configs
