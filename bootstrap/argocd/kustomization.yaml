apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: argocd

# Argo CD 공식 설치 매니페스트를 base 로 사용한다.
# 버전은 클러스터 k8s 버전과 호환되는 태그로 고정할 것.
#   v3.5 는 k8s v1.33~v1.36 에서 테스트됨 (kind 노드 이미지 v1.34.0).
#   호환표: https://argo-cd.readthedocs.io/en/stable/operator-manual/installation/
#   CLI 이미지(ci/.gitlab-ci.yml 의 .argocd-wait)도 같은 태그로 맞춘다.
#   install.yaml     : 단일 인스턴스(개발/소규모)
#   ha/install.yaml  : 운영(HA, Redis 3-node)
resources:
  - namespace.yaml
  - https://raw.githubusercontent.com/argoproj/argo-cd/v3.5.2/manifests/install.yaml
  # 운영에서는 위 줄 대신 아래 사용
  # - https://raw.githubusercontent.com/argoproj/argo-cd/v3.5.2/manifests/ha/install.yaml
  - ingress.yaml

# configs/ 컴포넌트가 argocd-cm, argocd-rbac-cm, argocd-cmd-params-cm,
# argocd-notifications-cm 을 병합한다. 시크릿 값은 병합하지 않는다(README 4.2, 5).
# argocd-server 의 --insecure 는 argocd-cmd-params-cm 의 server.insecure 로 제어된다.
components:
  - ./configs
