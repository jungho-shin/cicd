apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd-server
  namespace: argocd
  annotations:
    # 평문(HTTP) 전제. cert-manager 가 없어 TLS 시크릿이 생기지 않으므로 tls: 블록과
    # ssl-redirect 를 두지 않는다(두면 리다이렉트만 돈다). argocd-server 도
    # argocd-cmd-params-cm 의 server.insecure: "true" 로 평문을 받는다.
    nginx.ingress.kubernetes.io/backend-protocol: HTTP
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
spec:
  ingressClassName: nginx
  rules:
    - host: argocd.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: argocd-server
                port:
                  name: http
---
# argocd CLI 는 gRPC 를 사용하므로 별도 호스트로 분리하는 것이 안정적이다.
# 평문이므로 CLI 에는 --grpc-web --plaintext 를 붙인다(README 4.3).
# backend-protocol: GRPC 는 h2c(평문 HTTP/2)로 argocd-server 에 붙는다.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd-server-grpc
  namespace: argocd
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: GRPC
spec:
  ingressClassName: nginx
  rules:
    - host: grpc.argocd.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: argocd-server
                port:
                  name: https
