# ---------------------------------------------------------------------------
# CoreDNS 에 *.example.com 을 ingress-nginx 컨트롤러로 보내는 rewrite 를 추가한다.
#
# 왜 필요한가
#   Windows 의 hosts 파일은 클러스터 밖에서만 유효하다. 파드는 CoreDNS 에게 묻고,
#   CoreDNS 는 example.com 을 모르므로 NXDOMAIN 이 난다. 그래서 클러스터 안에서
#   도는 것들(kaniko push, Argo CD 의 repoURL, CI 의 argocd CLI, Image Updater)이
#   전부 실패한다. 확인:
#     kubectl run dnstest --rm -it --image=busybox:1.36 --restart=Never #       -- nslookup nexus-docker.example.com
#
# 왜 nexus Service 가 아니라 ingress-nginx 컨트롤러로 보내는가
#   이미지 참조(nexus-docker.example.com/my-group/app:tag)에는 포트가 없어 80 으로
#   붙는데, nexus Service 는 8081/8082/8083 만 연다. 컨트롤러는 80 을 열고,
#   rewrite 는 DNS 질의만 바꾸고 HTTP Host 헤더는 건드리지 않으므로 기존 Ingress 의
#   host 기반 라우팅(nexus-docker→8082, nexus-docker-group→8083)이 그대로 살아난다.
#   덕분에 호스트 하나당 규칙 하나로 전부 처리된다.
#
# 대상 호스트
#   nexus.example.com               Nexus UI
#   nexus-docker.example.com        Docker 레지스트리 (kaniko push, Image Updater)
#   nexus-docker-group.example.com  Docker 레지스트리 (pull 전용)
#   gitlab.example.com              GitLab (Argo CD repoURL, CI 의 GITOPS_REPO)
#   argocd.example.com              Argo CD UI
#   grpc.argocd.example.com         Argo CD gRPC (CI 의 ARGOCD_SERVER)
#   jenkins.example.com             Jenkins (부록)
#   sample-app.dev.example.com      샘플 앱 dev
#   sample-app.example.com          샘플 앱 prod
#
# 주의
#   - CoreDNS 의 플러그인 실행 순서는 Corefile 에 쓴 순서가 아니라 컴파일 시점의
#     plugin.cfg 로 정해진다. rewrite 는 kubernetes 보다 앞, cache 보다 뒤에서
#     돌기 때문에 아래 위치는 가독성을 위한 것일 뿐이다.
#   - 정규식(rewrite name regex ...) 대신 호스트를 하나씩 적는다. 비정규식
#     rewrite name 은 응답의 이름을 원래 질의 이름으로 복원해 주지만,
#     와일드카드는 복원할 수 없다.
#   - Corefile 은 ConfigMap 의 문자열 값이라 부분 병합이 안 된다. 아래는 kubeadm
#     이 만든 원본(kind v0.30.0 / k8s v1.34.0)에 rewrite 만 끼운 전체 교체본이다.
#     클러스터를 다른 버전으로 다시 만들었다면 먼저 원본을 확인하고 갱신할 것:
#       kubectl -n kube-system get cm coredns -o jsonpath='{.data.Corefile}'
#
# 적용
#   kubectl apply -f bootstrap/coredns/coredns-cm.yaml
#   kubectl -n kube-system rollout restart deploy/coredns
#   kubectl -n kube-system rollout status  deploy/coredns
#
# 선행 조건: ingress-nginx 가 설치돼 있어야 한다(README 1.3). 컨트롤러 Service 가
# 없으면 rewrite 대상이 해석되지 않는다.
#
# 이 패치는 kind delete cluster 와 함께 사라진다. 클러스터를 다시 만들면 다시 적용한다.
# ---------------------------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns
  namespace: kube-system
data:
  Corefile: |
    .:53 {
        errors
        health {
           lameduck 5s
        }
        ready
        # --- 로컬 호스트명을 ingress-nginx 로 보낸다 (이 블록만 추가됨) ---
        rewrite name nexus.example.com              ingress-nginx-controller.ingress-nginx.svc.cluster.local
        rewrite name nexus-docker.example.com       ingress-nginx-controller.ingress-nginx.svc.cluster.local
        rewrite name nexus-docker-group.example.com ingress-nginx-controller.ingress-nginx.svc.cluster.local
        rewrite name gitlab.example.com             ingress-nginx-controller.ingress-nginx.svc.cluster.local
        rewrite name argocd.example.com             ingress-nginx-controller.ingress-nginx.svc.cluster.local
        rewrite name grpc.argocd.example.com        ingress-nginx-controller.ingress-nginx.svc.cluster.local
        rewrite name jenkins.example.com            ingress-nginx-controller.ingress-nginx.svc.cluster.local
        rewrite name sample-app.dev.example.com     ingress-nginx-controller.ingress-nginx.svc.cluster.local
        rewrite name sample-app.example.com         ingress-nginx-controller.ingress-nginx.svc.cluster.local
        # ----------------------------------------------------------------
        kubernetes cluster.local in-addr.arpa ip6.arpa {
           pods insecure
           fallthrough in-addr.arpa ip6.arpa
           ttl 30
        }
        prometheus :9153
        forward . /etc/resolv.conf {
           max_concurrent 1000
        }
        cache 30 {
           disable success cluster.local
           disable denial cluster.local
        }
        loop
        reload
        loadbalance
    }
