apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# metrics-server 공식 매니페스트를 base 로 사용한다 (kube-system 에 설치된다).
# 버전은 태그로 고정한다. 호환표: https://github.com/kubernetes-sigs/metrics-server#compatibility-matrix
# 다른 bootstrap 디렉터리와 달리 네임스페이스를 새로 만들지 않는다.
resources:
  - https://github.com/kubernetes-sigs/metrics-server/releases/download/v0.8.0/components.yaml

# kind 노드의 kubelet 서빙 인증서는 자체 서명이고 노드 IP 가 SAN 에 없다.
# 검증을 끄지 않으면 스크랩이 x509 오류로 실패해 파드가 Ready 가 되지 않는다(README 1.8).
patches:
  - target:
      kind: Deployment
      name: metrics-server
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --kubelet-insecure-tls
