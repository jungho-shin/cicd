apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: jenkins

resources:
  - namespace.yaml
  - local-pv.yaml       # 동적 프로비저너가 있으면 이 줄 삭제
  - rbac.yaml
  - casc.yaml
  - jenkins.yaml
  - ingress.yaml
  # DNS/Ingress 없이 노드 IP 로 접속하려면 주석 해제 (http://<노드IP>:30808)
  # kind 에서는 30808 포트 매핑이 없어 클러스터 밖에서 접속되지 않는다.
  # UI 는 Ingress(jenkins.example.com)로 접속한다. README 1.7 참고.
  # - nodeport.yaml
