# ---------------------------------------------------------------------------
# PostgreSQL(dev/prod) 용 hostPath PV. nodeAffinity 로 storage-node=true 워커 한 대에 고정한다.
# PV 는 클러스터 범위 리소스라 Argo CD(AppProject 가 Namespace 만 허용)가 아니라
# kubectl 로 적용한다(README 9.2). PVC 는 manifests/postgres 에 있고 Argo CD 가 만든다.
#
# 적용 전 노드에서 디렉터리를 미리 만든다(README 9.2):
#   mkdir -p /data/postgres/dev /data/postgres/prod
#   sudo chown -R 999:999 /data/postgres     # postgres 컨테이너 UID (공식 이미지 debian 판)
#
# hostPath type 을 Directory 로 둔다. DirectoryOrCreate 면 kubelet 이 root 소유로 만들어
# UID 999 가 쓰지 못하고 initdb 가 Permission denied 로 죽는다. 없으면 파드가 바로 실패하는 쪽이 낫다.
#
# claimRef 로 PVC 를 미리 지정한다. dev PVC 가 prod PV 를 잡는 식의 엇갈림을 막는다.
# ---------------------------------------------------------------------------
apiVersion: v1
kind: PersistentVolume
metadata:
  name: postgres-dev-pv
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual
  claimRef:
    namespace: postgres-dev
    name: dev-postgres-data
  hostPath:
    path: /data/postgres/dev
    type: Directory
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: storage-node
              operator: In
              values:
                - "true"
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: postgres-prod-pv
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual
  claimRef:
    namespace: postgres-prod
    name: prod-postgres-data
  hostPath:
    path: /data/postgres/prod
    type: Directory
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: storage-node
              operator: In
              values:
                - "true"
