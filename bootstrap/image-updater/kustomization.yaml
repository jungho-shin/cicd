apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argocd

# Argo CD Image Updater: 레지스트리에 새 이미지 태그가 올라오면
# gitops 리포지토리에 write-back 커밋을 남긴다.
# 기본 구성은 Jenkins 가 직접 커밋하므로 이 컴포넌트를 쓰지 않는다. 둘 중 하나만 쓴다(README "이미지 태그 갱신 방식").
resources:
  - https://raw.githubusercontent.com/argoproj-labs/argocd-image-updater/v0.16.0/manifests/install.yaml
  - git-creds.yaml

patches:
  - path: config.yaml
