# NOTE: patch 대상 매칭용 파일이므로 metadata.namespace 를 지정하지 않는다.
# upstream install.yaml 의 리소스에는 namespace 가 없고, kustomization 의
# `namespace: argocd` 트랜스포머는 patch 적용 이후에 실행되기 때문이다.
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-image-updater-config
data:
  applications_api: argocd
  argocd.grpc_web: "true"
  argocd.server_addr: argocd-server.argocd.svc.cluster.local:80
  argocd.plaintext: "true"
  git.user: argocd-image-updater
  git.email: argocd-image-updater@example.com
  registries.conf: |
    registries:
      - name: private-registry
        api_url: https://my-registry.example.com
        prefix: my-registry.example.com
        credentials: pullsecret:argocd/regcred
        default: true
