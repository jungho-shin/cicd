# ---------------------------------------------------------------------------
# 단일 노드(VirtualBox 등) 클러스터용 hostPath PV.
# 동적 프로비저너(StorageClass)가 이미 있다면 이 파일을 kustomization 에서 빼고
# PVC 의 storageClassName: manual 줄도 제거해 기본 StorageClass 를 쓰면 된다.
#
# 적용 전 노드에서 디렉터리를 미리 만들어야 한다:
#   mkdir -p /data/bitbucket /data/postgres
#   chown -R 2003:2003 /data/bitbucket     # bitbucket 컨테이너 UID
#   chown -R 999:999  /data/postgres       # postgres 컨테이너 UID
# ---------------------------------------------------------------------------
apiVersion: v1
kind: PersistentVolume
metadata:
  name: bitbucket-home-pv
spec:
  capacity:
    storage: 20Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual
  hostPath:
    path: /data/bitbucket
    type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: bitbucket-postgres-pv
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual
  hostPath:
    path: /data/postgres
    type: DirectoryOrCreate
