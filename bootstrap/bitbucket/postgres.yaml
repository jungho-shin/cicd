apiVersion: v1
kind: Secret
metadata:
  name: bitbucket-db
  namespace: bitbucket
type: Opaque
stringData:
  POSTGRES_DB: bitbucket
  POSTGRES_USER: bitbucket
  # 운영에서는 kubectl create secret / SealedSecrets 로 대체할 것
  POSTGRES_PASSWORD: "11111111"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bitbucket-postgres
  namespace: bitbucket
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: manual        # 기본 StorageClass 를 쓰려면 이 줄 삭제
  volumeName: bitbucket-postgres-pv
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: bitbucket
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: bitbucket
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      securityContext:
        fsGroup: 999
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - name: postgres
              containerPort: 5432
          envFrom:
            - secretRef:
                name: bitbucket-db
          env:
            # hostPath 하위에 data 디렉터리를 따로 두어 lost+found 충돌을 피한다
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "bitbucket", "-d", "bitbucket"]
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "bitbucket", "-d", "bitbucket"]
            initialDelaySeconds: 30
            periodSeconds: 30
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: bitbucket-postgres
