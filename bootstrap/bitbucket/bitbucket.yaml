apiVersion: v1
kind: Secret
metadata:
  name: bitbucket-setup
  namespace: bitbucket
type: Opaque
stringData:
  # Atlassian 에서 발급받은 평가/정식 라이선스 키 (Bitbucket Data Center)
  # https://my.atlassian.com 에서 30일 평가 라이선스 발급 가능
  SETUP_LICENSE: __REPLACE_ME__
  SETUP_SYSADMIN_USERNAME: admin
  SETUP_SYSADMIN_PASSWORD: __REPLACE_ME__
  SETUP_SYSADMIN_DISPLAYNAME: Administrator
  SETUP_SYSADMIN_EMAILADDRESS: admin@example.com
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bitbucket-home
  namespace: bitbucket
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: manual        # 기본 StorageClass 를 쓰려면 이 줄 삭제
  volumeName: bitbucket-home-pv
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: bitbucket
  namespace: bitbucket
spec:
  type: ClusterIP
  selector:
    app: bitbucket
  ports:
    - name: http
      port: 7990
      targetPort: 7990
    - name: ssh
      port: 7999
      targetPort: 7999
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: bitbucket
  namespace: bitbucket
spec:
  serviceName: bitbucket
  replicas: 1
  selector:
    matchLabels:
      app: bitbucket
  template:
    metadata:
      labels:
        app: bitbucket
    spec:
      securityContext:
        runAsUser: 2003
        runAsGroup: 2003
        fsGroup: 2003
      initContainers:
        # postgres 가 준비되기 전에 기동하면 설치 마법사가 실패한다
        - name: wait-for-db
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z postgres 5432; do
                echo "waiting for postgres..."; sleep 3
              done
      containers:
        - name: bitbucket
          image: atlassian/bitbucket:9.4
          ports:
            - name: http
              containerPort: 7990
            - name: ssh
              containerPort: 7999
          envFrom:
            - secretRef:
                name: bitbucket-setup
          env:
            - name: JDBC_DRIVER
              value: org.postgresql.Driver
            - name: JDBC_URL
              value: jdbc:postgresql://postgres.bitbucket.svc.cluster.local:5432/bitbucket
            - name: JDBC_USER
              valueFrom:
                secretKeyRef:
                  name: bitbucket-db
                  key: POSTGRES_USER
            - name: JDBC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bitbucket-db
                  key: POSTGRES_PASSWORD

            - name: SETUP_DISPLAYNAME
              value: Bitbucket
            - name: SETUP_BASEURL
              value: http://bitbucket.example.com

            # Ingress(nginx) 뒤에 두는 경우 리버스 프록시 설정
            - name: SERVER_PROXY_NAME
              value: bitbucket.example.com
            - name: SERVER_PROXY_PORT
              value: "80"
            - name: SERVER_SCHEME
              value: http
            - name: SERVER_SECURE
              value: "false"

            # 코드 검색용 OpenSearch 는 별도 배포가 필요하므로 비활성화한다.
            # (검색 외의 기능에는 영향 없음)
            - name: ELASTICSEARCH_ENABLED
              value: "false"

            - name: JVM_MINIMUM_MEMORY
              value: 1g
            - name: JVM_MAXIMUM_MEMORY
              value: 2g
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 3Gi
          volumeMounts:
            - name: home
              mountPath: /var/atlassian/application-data/bitbucket
          # 최초 기동 시 DB 스키마 생성으로 3~5분 걸린다
          startupProbe:
            httpGet:
              path: /status
              port: http
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /status
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /status
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
      volumes:
        - name: home
          persistentVolumeClaim:
            claimName: bitbucket-home
