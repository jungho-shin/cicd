# Ingress 나 DNS 가 아직 없을 때 노드 IP 로 바로 접속하기 위한 NodePort.
# 사용하려면 kustomization.yaml 의 resources 에서 주석을 해제한다.
#
#   UI            http://<노드IP>:30081
#   docker-hosted <노드IP>:30082   (push/pull)
#   docker-group  <노드IP>:30083   (pull 전용)
apiVersion: v1
kind: Service
metadata:
  name: nexus-nodeport
  namespace: nexus
spec:
  type: NodePort
  selector:
    app: nexus
  ports:
    - name: http
      port: 8081
      targetPort: 8081
      nodePort: 30081
    - name: docker-hosted
      port: 8082
      targetPort: 8082
      nodePort: 30082
    - name: docker-group
      port: 8083
      targetPort: 8083
      nodePort: 30083
