# Docker 레지스트리용 NodePort. kustomization.yaml 에서 **기본 활성**이다.
#
#   docker-hosted localhost:30082   (push/pull)   kind-config.yaml 이 매핑
#   docker-group  localhost:30083   (pull 전용)   kind-config.yaml 이 매핑
#   UI            <노드IP>:30081                  일반 클러스터에서만
#
# 30082/30083 이 필수인 이유: kind-config.yaml 의 containerdConfigPatches 가
# 노드의 이미지 pull 을 http://localhost:30082 로 보낸다. 이 Service 가 없으면
# 클러스터 안 pull 이 실패한다. WSL/Windows 에서 docker login/push 할 때도 같은
# 주소를 쓴다.
#
# 30081(UI)은 kind-config.yaml 에 포트 매핑이 없어 클러스터 밖에서 열리지 않는다.
# UI 는 Ingress(nexus.example.com)로 접속한다. README 1.7 / 3.2 참고.
apiVersion: v1
kind: Service
metadata:
  name: nexus-nodeport
  namespace: nexus
spec:
  type: NodePort
  selector:
    app: nexus
  ports:
    - name: http
      port: 8081
      targetPort: 8081
      nodePort: 30081
    - name: docker-hosted
      port: 8082
      targetPort: 8082
      nodePort: 30082
    - name: docker-group
      port: 8083
      targetPort: 8083
      nodePort: 30083
