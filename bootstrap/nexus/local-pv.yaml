# ---------------------------------------------------------------------------
# hostPath PV. nodeAffinity 로 storage-node=true 워커 한 대에 고정한다.
# 단일 노드 클러스터라면 nodeAffinity 블록을 지워도 된다.
# 동적 프로비저너(StorageClass)가 이미 있다면 이 파일을 kustomization 에서 빼고
# PVC 의 storageClassName: manual / volumeName 줄도 제거해 기본 StorageClass 를 쓴다.
#
# 적용 전 노드에서 디렉터리를 미리 만들어야 한다:
#   mkdir -p /data/nexus
#   chown -R 200:200 /data/nexus     # nexus 컨테이너 UID
#
# 용량은 넉넉히 잡는다. 프록시 캐시(maven-central, npmjs, docker hub)가
# 쌓이면 수십 GB 까지 늘어난다.
# ---------------------------------------------------------------------------
apiVersion: v1
kind: PersistentVolume
metadata:
  name: nexus-data-pv
spec:
  capacity:
    storage: 50Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual
  hostPath:
    path: /data/nexus
    type: DirectoryOrCreate
  # 스토리지 노드 고정. kind-config.yaml 에서 worker 한 대에만 storage-node=true
  # 라벨과 /data extraMounts 를 줬다. 이 블록이 없으면 파드가 다른 워커에 떠도
  # 스케줄러가 막지 않고, 롤아웃 중 두 파드가 같은 디렉터리를 동시에 쓴다.
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: storage-node
              operator: In
              values:
                - "true"
