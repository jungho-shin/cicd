apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: nexus

resources:
  - namespace.yaml
  - local-pv.yaml       # 동적 프로비저너가 있으면 이 줄 삭제
  - nexus.yaml
  - ingress.yaml
  # NodePort. kind 에서는 30082/30083 이 반드시 필요하다.
  #   30082 docker-hosted / 30083 docker-group
  #     kind-config.yaml 의 containerdConfigPatches 가 노드의 이미지 pull 을
  #     localhost:30082 로 보낸다. 이 Service 가 없으면 pull 이 실패한다.
  #     WSL/Windows 에서 docker login/push 할 때도 localhost:30082 를 쓴다.
  #   30081 UI
  #     kind-config.yaml 에 포트 매핑이 없어 클러스터 밖에서는 접속되지 않는다.
  #     UI 는 Ingress(nexus.example.com)로 접속한다. README 1.7 참고.
  # 일반 클러스터(호스트가 곧 노드)라면 http://<노드IP>:30081 로 UI 에 바로 붙는다.
  - nodeport.yaml
