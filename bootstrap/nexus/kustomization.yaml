apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: nexus

resources:
  - namespace.yaml
  - local-pv.yaml       # 동적 프로비저너가 있으면 이 줄 삭제
  - nexus.yaml
  - ingress.yaml
  # DNS/Ingress 없이 노드 IP 로 접속하려면 주석 해제 (http://<노드IP>:30081)
  # kind 클러스터에서는 동작하지 않는다. 「부록: kind 로 로컬 클러스터 구성하기」참고
  # - nodeport.yaml
