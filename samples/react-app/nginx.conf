# 매니페스트(deployment.yaml)의 조건에 맞춘 설정:
#   - 포트 8080, /healthz 200
#   - runAsUser 10001 (root 아님)
#   - readOnlyRootFilesystem: true → 쓰기가 필요한 경로(pid, 임시 파일, 런타임 설정)를 전부 /tmp 로.
#     /tmp 는 Deployment 에서 emptyDir 로 마운트된다.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  server_tokens off;
  sendfile on;

  # 기본값(/var/cache/nginx/*)은 읽기 전용이라 기동에 실패한다
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path       /tmp/proxy_temp;
  fastcgi_temp_path     /tmp/fastcgi_temp;
  uwsgi_temp_path       /tmp/uwsgi_temp;
  scgi_temp_path        /tmp/scgi_temp;

  server {
    listen 8080;
    root /usr/share/nginx/html;

    location = /healthz {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

    # docker-entrypoint.sh 가 APP_ENV 로 만든 파일. 이미지 안의 config.js(로컬 기본값)보다 우선한다
    location = /config.js {
      alias /tmp/config.js;
      add_header Cache-Control "no-store";
    }

    # Vite 가 파일명에 해시를 붙이므로 오래 캐시해도 된다
    location /assets/ {
      add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA: 없는 경로는 index.html 로
    location / {
      try_files $uri /index.html;
      add_header Cache-Control "no-cache";
    }
  }
}
