# GitLab 그룹의 리포지토리를 스캔해서 Application 을 자동 생성한다.
# 각 리포지토리 루트에 .argocd.yaml 이 있는 경우에만 대상이 된다.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: gitlab-group-apps
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - scmProvider:
        gitlab:
          group: my-group
          # 자체 호스팅이면 클러스터 내부 주소. Argo CD 가 /api/v4 를 붙인다.
          api: http://gitlab.gitlab.svc.cluster.local/
          includeSubgroups: true
          tokenRef:
            secretName: gitlab-scm-credentials
            key: token
        filters:
          - repositoryMatch: '^svc-.*'
            pathsExist: [.argocd.yaml, manifests]
        # 생성되는 repoURL 은 GitLab 의 external_url 을 그대로 따른다.
        # gitlab.example.com 을 쓴다면 Argo CD Pod 에서 그 호스트가 풀려야 하므로
        # CoreDNS 에 rewrite 를 넣거나, external_url 을 내부 주소로 맞춘다.
        cloneProtocol: https
  template:
    metadata:
      name: '{{ .repository }}-dev'
      annotations:
        repo: '{{ .repository }}'
    spec:
      project: dev
      source:
        repoURL: '{{ .url }}'
        targetRevision: '{{ .branch }}'
        path: manifests/overlays/dev
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{ .repository }}-dev'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
---
apiVersion: v1
kind: Secret
metadata:
  name: gitlab-scm-credentials
  namespace: argocd
type: Opaque
stringData:
  # Group access token (read_api, read_repository)
  token: __REPLACE_ME__
