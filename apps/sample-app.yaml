apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sample-app-dev
  namespace: argocd
  annotations:
    repo: sample-app          # notifications 템플릿에서 사용
    # argocd-image-updater 사용 시:
    argocd-image-updater.argoproj.io/image-list: app=my-registry.example.com/my-workspace/sample-app
    argocd-image-updater.argoproj.io/app.update-strategy: newest-build
    argocd-image-updater.argoproj.io/app.allow-tags: regexp:^dev-[0-9a-f]{7}$
    argocd-image-updater.argoproj.io/write-back-method: git
    argocd-image-updater.argoproj.io/git-branch: main
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: dev
  source:
    repoURL: https://bitbucket.org/my-workspace/gitops-manifests.git
    targetRevision: main
    path: manifests/sample-app/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: sample-app-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
  revisionHistoryLimit: 10
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sample-app-prod
  namespace: argocd
  annotations:
    repo: sample-app
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: prod
  source:
    repoURL: https://bitbucket.org/my-workspace/gitops-manifests.git
    targetRevision: main
    path: manifests/sample-app/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: sample-app-prod
  syncPolicy:
    # 운영은 수동 승인 배포. 자동화하려면 automated 블록을 추가한다.
    syncOptions:
      - CreateNamespace=true
  revisionHistoryLimit: 20
