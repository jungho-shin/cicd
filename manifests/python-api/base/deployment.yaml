apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-api
spec:
  # 데이터가 파드 메모리에만 있어서 1 로 둔다. 2 이상이면 요청마다 다른 파드가 받아
  # 목록이 들쭉날쭉해진다(README 8장). 늘리려면 저장소를 DB 로 빼야 한다.
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: python-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: python-api
    spec:
      serviceAccountName: python-api
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: nexus-docker.example.com/my-group/python-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: APP_ENV
              value: base
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      imagePullSecrets:
        - name: regcred
