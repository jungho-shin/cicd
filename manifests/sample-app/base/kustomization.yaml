apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - deployment.yaml
  - service.yaml
  - serviceaccount.yaml

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/name: sample-app
      app.kubernetes.io/managed-by: argocd

images:
  - name: my-registry.example.com/my-workspace/sample-app
    newTag: latest
