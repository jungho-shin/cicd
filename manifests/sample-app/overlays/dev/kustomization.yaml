apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: sample-app-dev
namePrefix: dev-

resources:
  - ../../base
  - ingress.yaml

replicas:
  - name: sample-app
    count: 1

# GitLab CI 가 `kustomize edit set image` 로 이 값을 갱신하고
# gitops 리포지토리에 커밋한다. Argo CD 가 그 커밋을 감지해 배포한다.
images:
  - name: my-registry.example.com/my-group/sample-app
    newTag: dev-0000000

patches:
  - target:
      kind: Deployment
      name: sample-app
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: dev
