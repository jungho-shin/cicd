# ===========================================================================
# 애플리케이션 리포지토리(bitbucket.org/my-workspace/sample-app)의 루트에
# `bitbucket-pipelines.yml` 이름으로 배치한다.
#
# 흐름: 빌드/테스트 → 이미지 빌드&푸시 → gitops 리포지토리 태그 갱신 커밋
#       → Argo CD 가 감지하여 배포
#
# Repository variables (Repository settings > Repository variables):
#   DOCKER_REGISTRY      my-registry.example.com
#   DOCKER_USERNAME      (secured)
#   DOCKER_PASSWORD      (secured)
#   GITOPS_REPO          bitbucket.org/my-workspace/gitops-manifests.git
#   GITOPS_USER          (secured) Bitbucket 사용자명
#   GITOPS_APP_PASSWORD  (secured) App Password (Repositories: Write)
#   ARGOCD_SERVER        grpc.argocd.example.com
#   ARGOCD_AUTH_TOKEN    (secured) `argocd account generate-token --account cicd`
# ===========================================================================
image: atlassian/default-image:4

definitions:
  services:
    docker:
      memory: 3072

  steps:
    - step: &build-test
        name: Build & Test
        script:
          - echo "빌드/테스트 명령을 프로젝트에 맞게 교체"
          - ./gradlew clean build          # 또는 npm ci && npm test
        artifacts:
          - build/libs/**

    - step: &docker-build-push
        name: Docker Build & Push
        services:
          - docker
        script:
          - export IMAGE_TAG="${BITBUCKET_BRANCH//\//-}-${BITBUCKET_COMMIT:0:7}"
          - export IMAGE="${DOCKER_REGISTRY}/my-workspace/sample-app"
          - echo "$DOCKER_PASSWORD" | docker login "$DOCKER_REGISTRY" -u "$DOCKER_USERNAME" --password-stdin
          - docker build -t "${IMAGE}:${IMAGE_TAG}" -t "${IMAGE}:${BITBUCKET_COMMIT}" .
          - docker push "${IMAGE}:${IMAGE_TAG}"
          - docker push "${IMAGE}:${BITBUCKET_COMMIT}"
          - echo "export IMAGE_TAG=${IMAGE_TAG}" > image.env
        artifacts:
          - image.env

    # DEPLOY_ENV 는 Deployment environment variable 로 주입한다 (dev / prod).
    - step: &update-gitops
        name: Update GitOps manifests
        image: line/kubectl-kustomize:latest
        clone:
          enabled: false
        script:
          - source image.env
          - git config --global user.email "ci@example.com"
          - git config --global user.name "bitbucket-pipelines"
          - git clone --depth 1 "https://${GITOPS_USER}:${GITOPS_APP_PASSWORD}@${GITOPS_REPO}" gitops
          - cd gitops/manifests/sample-app/overlays/${DEPLOY_ENV}
          - kustomize edit set image "my-registry.example.com/my-workspace/sample-app=${DOCKER_REGISTRY}/my-workspace/sample-app:${IMAGE_TAG}"
          - cd "${BITBUCKET_CLONE_DIR}/gitops"
          - git add -A
          - |
            if git diff --cached --quiet; then
              echo "매니페스트 변경 없음 - 커밋 생략"
              exit 0
            fi
            git commit -m "chore(${DEPLOY_ENV}): sample-app -> ${IMAGE_TAG} [skip ci]"
            git push origin HEAD:main

    - step: &argocd-wait
        name: Argo CD Sync & Wait
        image: argoproj/argocd:v3.0.6
        clone:
          enabled: false
        script:
          # webhook 이 설정돼 있으면 sync 는 자동으로 일어난다.
          # 파이프라인이 배포 완료까지 기다리게 하려면 이 스텝을 유지한다.
          - export ARGOCD_OPTS="--grpc-web --server $ARGOCD_SERVER --auth-token $ARGOCD_AUTH_TOKEN"
          - argocd app sync "sample-app-${DEPLOY_ENV}" $ARGOCD_OPTS
          - argocd app wait "sample-app-${DEPLOY_ENV}" --health --timeout 600 $ARGOCD_OPTS

pipelines:
  pull-requests:
    '**':
      - step: *build-test

  branches:
    develop:
      - step: *build-test
      - step: *docker-build-push
      - step:
          <<: *update-gitops
          name: Deploy to dev
          deployment: dev              # 이 환경에 DEPLOY_ENV=dev 를 정의
      - step:
          <<: *argocd-wait
          name: Wait for dev rollout
          deployment: dev

    main:
      - step: *build-test
      - step: *docker-build-push
      - step:
          <<: *update-gitops
          name: Deploy to production
          deployment: production       # 이 환경에 DEPLOY_ENV=prod 를 정의
          trigger: manual              # 운영은 수동 승인
      - step:
          <<: *argocd-wait
          name: Wait for production rollout
          deployment: production

  tags:
    'v*':
      - step: *build-test
      - step: *docker-build-push
