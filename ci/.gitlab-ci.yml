# ===========================================================================
# 애플리케이션 리포지토리(gitlab.example.com/my-group/react-app)의 루트에
# `.gitlab-ci.yml` 이름으로 배치한다. 앱 템플릿은 이 리포지토리의 samples/react-app/ (React + nginx).
#
# 흐름: 테스트/빌드(node) → 이미지 빌드&푸시(kaniko) → gitops 리포지토리 태그 갱신 커밋
#       → Argo CD 가 감지하여 배포 → 배포 완료까지 대기
#
# CI/CD Variables (Settings > CI/CD > Variables). README 부록 A.2 참고.
# **Protect variable 은 끈다** — 켜면 보호 브랜치(main)에서만 값이 들어가 develop 잡이 빈 값으로 실패한다.
#   DOCKER_REGISTRY      nexus-docker.example.com
#   DOCKER_USER          레지스트리 사용자
#   DOCKER_PASSWORD      레지스트리 비밀번호                                  (Masked)
#   GITOPS_REPO          gitlab.example.com/my-group/gitops-manifests.git   (스킴 없이. 잡에서 http:// 를 붙인다)
#   GITOPS_USER          아무 문자열(예: gitlab-ci). 인증은 토큰으로 한다
#   GITOPS_TOKEN         gitops-manifests 의 Project access token (Maintainer, write_repository) (Masked)
#   ARGOCD_SERVER        argocd.example.com:80   (평문 Ingress. 포트 생략 시 443 으로 붙을 수 있다)
#   ARGOCD_AUTH_TOKEN    `argocd account generate-token --account cicd`   (Masked)
#
# 러너는 bootstrap/gitlab/runner.yaml (kubernetes executor) 를 전제로 한다.
# 잡 이미지는 Docker Hub 요청 한도를 피하려고 Nexus docker-group(익명 pull)으로 받는다.
# ===========================================================================
stages: [test, build, deploy, verify]

variables:
  IMAGE: ${DOCKER_REGISTRY}/my-group/react-app
  IMAGE_TAG: ${CI_COMMIT_REF_SLUG}-${CI_COMMIT_SHORT_SHA}
  HUB: nexus-docker-group.example.com

build-test:
  stage: test
  image: ${HUB}/library/node:22-alpine
  script:
    - npm ci --no-audit --no-fund
    - npm test
    # 이미지 빌드는 Dockerfile 이 다시 하지만, 빌드 오류를 이 단계에서 먼저 잡는다
    - npm run build

docker-build-push:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  script:
    - mkdir -p /kaniko/.docker
    - AUTH=$(printf "%s:%s" "$DOCKER_USER" "$DOCKER_PASSWORD" | base64 | tr -d '\n')
    - printf '{"auths":{"%s":{"auth":"%s"}}}' "$DOCKER_REGISTRY" "$AUTH" > /kaniko/.docker/config.json
    # --insecure / --skip-tls-verify : 평문 HTTP 레지스트리로 push
    # --insecure-pull                : 평문 HTTP 레지스트리(docker-group)에서 베이스 이미지 pull
    - /kaniko/executor --context "$CI_PROJECT_DIR" --dockerfile Dockerfile
        --build-arg "APP_VERSION=${IMAGE_TAG}"
        --destination "${IMAGE}:${IMAGE_TAG}"
        --destination "${IMAGE}:${CI_COMMIT_SHA}"
        --insecure --skip-tls-verify --insecure-pull
  rules:
    - if: $CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG =~ /^v/

# gitops 리포지토리의 overlay 이미지 태그를 갱신한다.
.update-gitops:
  stage: deploy
  image: ${HUB}/library/alpine:3.22
  script:
    - apk add --no-cache git kustomize
    - git config --global user.email "ci@example.com"
    - git config --global user.name "gitlab-ci"
    - git clone --depth 1 "http://${GITOPS_USER}:${GITOPS_TOKEN}@${GITOPS_REPO}" gitops
    - cd gitops/manifests/react-app/overlays/${DEPLOY_ENV}
    # 왼쪽은 overlay 의 images[].name (고정 이름), 오른쪽이 새 이미지다.
    - kustomize edit set image "nexus-docker.example.com/my-group/react-app=${IMAGE}:${IMAGE_TAG}"
    - cd $CI_PROJECT_DIR/gitops
    - git add -A
    # 변경이 없으면 빈 커밋을 만들지 않고 그대로 끝낸다.
    - git diff --cached --quiet && exit 0
    # [skip ci] 로 gitops 리포지토리에서 파이프라인이 재귀 실행되는 것을 막는다.
    # 줄 전체를 작은따옴표로 감싼다. 커밋 메시지 안의 ": " 때문에 따옴표가 없으면
    # YAML 이 이 줄을 문자열이 아닌 키/값 맵으로 읽는다.
    - 'git commit -m "chore(${DEPLOY_ENV}): react-app -> ${IMAGE_TAG} [skip ci]"'
    - git push origin HEAD:main

# 배포가 끝날 때까지(Synced + Healthy) 파이프라인을 붙잡아 둔다.
.argocd-wait:
  stage: verify
  # 공식 이미지는 quay.io 에 배포된다. 서버(bootstrap/argocd/kustomization.yaml)와 같은 태그로 맞춘다.
  image: quay.io/argoproj/argocd:v3.5.2
  variables:
    GIT_STRATEGY: none
  script:
    # Argo CD Ingress 가 평문(HTTP)이므로 --plaintext 가 필요하다.
    - OPTS="--grpc-web --plaintext --server $ARGOCD_SERVER --auth-token $ARGOCD_AUTH_TOKEN"
    # 방금 커밋을 바로 보게 한다(webhook 이 먼저 했어도 무해)
    - argocd app get "react-app-${DEPLOY_ENV}" --refresh $OPTS > /dev/null
    # dev 는 자동 동기화라 CLI 가 sync 를 또 걸면 "another operation is already in progress" 로
    # 실패할 수 있다. 수동 동기화 대상(prod)만 sync 한다.
    - if [ "$ARGOCD_SYNC" = "true" ]; then argocd app sync "react-app-${DEPLOY_ENV}" $OPTS; fi
    - argocd app wait "react-app-${DEPLOY_ENV}" --sync --health --timeout 600 $OPTS

deploy-dev:
  extends: .update-gitops
  variables:
    DEPLOY_ENV: dev
  environment:
    name: dev
    url: http://react-app.dev.example.com
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"

wait-dev:
  extends: .argocd-wait
  needs: [deploy-dev]
  variables:
    DEPLOY_ENV: dev
    ARGOCD_SYNC: "false"
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"

# 운영은 수동 승인 후 배포한다.
deploy-prod:
  extends: .update-gitops
  variables:
    DEPLOY_ENV: prod
  environment:
    name: production
    url: http://react-app.example.com
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
  allow_failure: false

wait-prod:
  extends: .argocd-wait
  needs: [deploy-prod]
  variables:
    DEPLOY_ENV: prod
    ARGOCD_SYNC: "true"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
